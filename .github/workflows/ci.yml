name: V0.2 Foundation quality gate

on:
  push:
    branches: [v0.2-Foundation]
  pull_request:
    branches: [main, v0.2-Foundation]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify Todo UI contract
        run: npm run test:todo
      - name: Verify Todo configuration contract
        run: npm run test:todo-config
      - name: Verify Todo phase-two journey UX contract
        run: npm run test:todo-phase-two
      - name: Verify real-backend E2E source contract
        run: npm run test:e2e:contract
      - name: Verify Todo schema runtime contract
        run: npm run test:todo-schema
      - name: Verify Foundation CI scope
        run: npm run test:foundation-ci
      - name: Verify Foundation documentation contract
        run: npm run test:foundation-docs
      - name: Verify Foundation test identity UI
        run: npm run test:foundation-identities
      - name: Verify frontend source encoding
        run: npm run test:encoding
      - name: Build production bundle
        run: npm run build:prod

  frontend-e2e:
    runs-on: ubuntu-latest
    env:
      TODO_E2E_ARTIFACT_DIR: ${{ github.workspace }}/ruoyi-ui/output/playwright/lead-todo-guided-configuration/runs/phase-two-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: ruoyi-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build:prod
      - name: Verify phase two business journeys
        run: npm run test:e2e

  migration:
    runs-on: ubuntu-latest
    env:
      LOG_PATH: /tmp/ruoyi-logs
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: law_v017
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y mysql-client
      - name: Create isolated Foundation, trigger metadata and TD-001 test databases
        run: mysql --protocol=tcp -h127.0.0.1 -uroot -proot -e "alter database law_v017 character set utf8mb4 collate utf8mb4_unicode_ci; create database law_v017_foundation character set utf8mb4 collate utf8mb4_unicode_ci; create database law_v017_trigger_metadata character set utf8mb4 collate utf8mb4_unicode_ci; create database law_v017_lead_template character set utf8mb4 collate utf8mb4_unicode_ci"
      - name: Initialize v0.15 baseline schemas in empty databases
        run: |
          for database in law_v017 law_v017_foundation law_v017_trigger_metadata law_v017_lead_template; do
            for file in \
              sql/ry_20260417.sql \
              sql/quartz.sql \
              sql/lead_module_20260602.sql \
              sql/lead_menu_20260602.sql \
              sql/customer_contract_module_20260603.sql \
              sql/customer_contract_dict_patch_20260611.sql \
              sql/case_module_20260611.sql \
              sql/matter_module_20260615.sql \
              sql/matter_menu_patch_20260617.sql \
              sql/finance_module_20260624.sql \
              sql/customer_tag_assign_permission_fix_20260627.sql; do
              mysql --protocol=tcp -h127.0.0.1 -uroot -proot "$database" < "$file"
            done
          done
      - name: Verify isolated trigger metadata migration upgrade
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_v017_trigger_metadata?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: rm -rf ruoyi-admin/target/surefire-reports && mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=TodoTriggerRuleMetadataMigrationContractTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify isolated TD-001 configuration and all governed scenarios
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_v017_lead_template?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: |
          mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=LeadTemplateConfigurationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false test
          mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=TodoScenarioSimulationExternalMysqlIT -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Execute and verify all Flyway migrations
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_v017?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: |
          mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=FlywayMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test
          mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=FileMaterialEndToEndTest,FileObjectLockOrderExternalMysqlIT,HistoricalMigrationPreflightEndToEndTest,FoundationCollationMigrationTest,PhaseTwoDatabaseInvariantTest,TodoPhaseTwoTransactionTest,TodoRoutingJoinConcurrencyTest,TodoAutoActionFencingConcurrencyTest,TodoDefinitionLedgerConcurrencyTest,TodoAssignmentDelegationMapperExternalMysqlIT,TodoScheduleLockOrderExternalMysqlIT,NavigationMenuEncodingExternalMysqlIT,SystemManagementEncodingExternalMysqlIT,LeadFlowMapperExternalMysqlIT,LeadTodoProductionPortsExternalMysqlIT,LeadTodoFlowEndToEndTest,LeadTodoScheduleEndToEndTest,LeadTodoReadModelExternalMysqlIT,LeadProgressCycleRuntimeMySqlTest,LeadTodoReleaseVersionLockExternalMysqlIT,LeadTodoGuidedConfigurationExternalMysqlIT -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Assert external-database Todo tests were not skipped
        run: node ruoyi-ui/scripts/assert-external-db-reports.js ruoyi-admin/target/surefire-reports
      - name: Generate ephemeral Foundation test password
        shell: bash
        run: echo "FOUNDATION_TEST_USER_PASSWORD=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Verify isolated Foundation test identities
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_v017_foundation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=FoundationGovernanceRoleMigrationContractTest,FoundationTestIdentityEndToEndTest,FoundationTestIdentityRollbackTest -Dsurefire.failIfNoSpecifiedTests=false test

  todo-config-real-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TODO_E2E_DB_NAME: law_todo_config_e2e
      TODO_E2E_DB_HOST: 127.0.0.1
      TODO_E2E_DB_PORT: 3306
      TODO_E2E_DB_USER: root
      TODO_E2E_DB_PASSWORD: root
      TODO_E2E_REAL_BACKEND: true
      TODO_E2E_DROP_DATABASE_AFTER: true
      TODO_E2E_BROWSER: ${{ vars.TODO_E2E_BROWSER || 'chrome' }}
      TODO_E2E_ARTIFACT_DIR: ${{ github.workspace }}/ruoyi-ui/output/playwright/lead-todo-guided-configuration/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}
      LOG_PATH: /tmp/ruoyi-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require the user-selected browser channel
        shell: bash
        run: |
          test "$TODO_E2E_BROWSER" = chrome -o "$TODO_E2E_BROWSER" = msedge || {
            echo 'Set repository variable TODO_E2E_BROWSER to chrome or msedge after the user chooses a browser.' >&2
            exit 1
          }
      - name: Install runtime clients
        run: sudo apt-get update -qq && sudo apt-get install -y mysql-client apache2-utils redis-tools
      - name: Create utf8mb4 E2E database
        run: mysql --protocol=tcp -h127.0.0.1 -uroot -proot -e "create database law_todo_config_e2e character set utf8mb4 collate utf8mb4_unicode_ci"
      - name: Initialize v0.15 baseline schema
        shell: bash
        run: |
          for file in \
            sql/ry_20260417.sql \
            sql/quartz.sql \
            sql/lead_module_20260602.sql \
            sql/lead_menu_20260602.sql \
            sql/customer_contract_module_20260603.sql \
            sql/customer_contract_dict_patch_20260611.sql \
            sql/case_module_20260611.sql \
            sql/matter_module_20260615.sql \
            sql/matter_menu_patch_20260617.sql \
            sql/finance_module_20260624.sql \
            sql/customer_tag_assign_permission_fix_20260627.sql; do
            mysql --protocol=tcp -h127.0.0.1 -uroot -proot law_todo_config_e2e < "$file"
          done
      - name: Execute real Flyway migrations
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_todo_config_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=FlywayRuntimeMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Create isolated Todo configuration test identity
        shell: bash
        run: |
          # RuoYi rejects login passwords longer than 20 characters before BCrypt validation.
          password="$(openssl rand -hex 9)"
          password_hash="$(htpasswd -bnBC 10 '' "$password" | tr -d ':\n')"
          run_marker="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sla_code="E2E_SLA_${run_marker}"
          dod_code="E2E_DOD_${run_marker}"
          lead_no="E2E_LEAD_${run_marker}"
          echo "TODO_CONFIG_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "TODO_CONFIG_E2E_PASSWORD_HASH=$password_hash" >> "$GITHUB_ENV"
          echo "TODO_CONFIG_E2E_RUN_MARKER=$run_marker" >> "$GITHUB_ENV"
          echo "TODO_CONFIG_E2E_SLA_CODE=$sla_code" >> "$GITHUB_ENV"
          echo "TODO_CONFIG_E2E_DOD_CODE=$dod_code" >> "$GITHUB_ENV"
          echo "TODO_CONFIG_E2E_LEAD_NO=$lead_no" >> "$GITHUB_ENV"
          sed -e "s|TODO_CONFIG_E2E_PASSWORD_HASH|$password_hash|g" \
              -e "s|TODO_CONFIG_E2E_DATABASE|$TODO_E2E_DB_NAME|g" \
              -e "s|TODO_CONFIG_E2E_RUN_MARKER|$run_marker|g" \
              -e "s|TODO_CONFIG_E2E_SLA_CODE|$sla_code|g" \
              -e "s|TODO_CONFIG_E2E_DOD_CODE|$dod_code|g" \
              -e "s|TODO_CONFIG_E2E_LEAD_NO|$lead_no|g" \
              ruoyi-ui/tests/e2e/bootstrap/todo-config-admin.sql \
            | mysql --protocol=tcp -h127.0.0.1 -uroot -proot law_todo_config_e2e
          lead_id="$(mysql --batch --skip-column-names --protocol=tcp -h127.0.0.1 -uroot -proot law_todo_config_e2e \
            -e "select lead_id from biz_lead where lead_no='$lead_no' and create_by='$run_marker' limit 1")"
          echo "TODO_CONFIG_E2E_BUSINESS_ID=$lead_id" >> "$GITHUB_ENV"
      - name: Reset dedicated Todo configuration Redis
        run: test "$(redis-cli -h127.0.0.1 -p6379 FLUSHDB)" = OK
      - name: Build backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Start real backend
        shell: bash
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/law_todo_config_e2e?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          TOKEN_SECRET: todo-config-e2e-only-secret-with-at-least-32-characters
          FLYWAY_ENABLED: true
        run: |
          nohup java -jar ruoyi-admin/target/ruoyi-admin.jar > "$RUNNER_TEMP/todo-config-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/todo-config-backend.pid"
          for attempt in $(seq 1 90); do
            captcha_json="$(curl --fail --silent http://127.0.0.1:8080/captchaImage || true)"
            if grep -q '"captchaEnabled":false' <<<"$captcha_json"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/todo-config-backend.log"
          exit 1
      - name: Install frontend dependencies
        working-directory: ruoyi-ui
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify real-backend E2E source contract
        working-directory: ruoyi-ui
        run: npm run test:e2e:contract
      - name: Build production frontend
        working-directory: ruoyi-ui
        run: npm run build:prod
      - name: Validate production static server and backend proxy
        working-directory: ruoyi-ui
        shell: bash
        run: |
          TODO_E2E_FRONTEND_PORT=4174 TODO_E2E_BACKEND_URL=http://127.0.0.1:8080 node scripts/serve-e2e-production.js > "$RUNNER_TEMP/todo-config-frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          curl --fail --silent http://127.0.0.1:4174/prod-api/captchaImage >/dev/null
          kill "$frontend_pid"
          wait "$frontend_pid" || true
          trap - EXIT
      - name: Install the user-selected browser
        working-directory: ruoyi-ui
        run: npx playwright install --with-deps "$TODO_E2E_BROWSER"
      - name: Run Todo configuration real-backend journey
        working-directory: ruoyi-ui
        run: npm run test:e2e -- tests/e2e/todo-config-center.spec.js tests/e2e/todo-config-journey.spec.js
      - name: Upload real-backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-config-real-e2e-diagnostics
          path: |
            ${{ runner.temp }}/todo-config-backend.log
            ruoyi-ui/output/playwright

  lead-todo-real-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TODO_E2E_DB_NAME: law_lead_todo_e2e
      TODO_E2E_DB_HOST: 127.0.0.1
      TODO_E2E_DB_PORT: 3306
      TODO_E2E_DB_USER: root
      TODO_E2E_DB_PASSWORD: root
      TODO_E2E_REAL_BACKEND: true
      TODO_E2E_BACKEND_URL: http://127.0.0.1:8080
      TODO_E2E_BROWSER: chrome
      LEAD_TODO_E2E: true
      LEAD_INFORMATION_USER: ft_info
      LEAD_SALES_USER: ft_sales
      LEAD_ALTERNATE_SALES_USER: ft_case_manager
      LEAD_SUPERVISOR_USER: ft_partner_manager
      LEAD_POLICY_ADMIN_USER: ft_product_owner
      FOUNDATION_E2E_IDENTITY_SECRET: lead-todo-e2e-identity-secret-with-at-least-32-characters
      LOG_PATH: /tmp/ruoyi-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime clients
        run: sudo apt-get update -qq && sudo apt-get install -y mysql-client
      - name: Create utf8mb4 isolated Lead Todo database
        run: mysql --protocol=tcp -h127.0.0.1 -uroot -proot -e "create database law_lead_todo_e2e character set utf8mb4 collate utf8mb4_unicode_ci"
      - name: Initialize v0.15 baseline schema
        shell: bash
        run: |
          for file in \
            sql/ry_20260417.sql \
            sql/quartz.sql \
            sql/lead_module_20260602.sql \
            sql/lead_menu_20260602.sql \
            sql/customer_contract_module_20260603.sql \
            sql/customer_contract_dict_patch_20260611.sql \
            sql/case_module_20260611.sql \
            sql/matter_module_20260615.sql \
            sql/matter_menu_patch_20260617.sql \
            sql/finance_module_20260624.sql \
            sql/customer_tag_assign_permission_fix_20260627.sql; do
            mysql --protocol=tcp -h127.0.0.1 -uroot -proot law_lead_todo_e2e < "$file"
          done
      - name: Execute all Flyway migrations
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_lead_todo_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=FlywayRuntimeMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Generate profile-gated test identity password and run marker
        shell: bash
        run: |
          password="$(openssl rand -hex 9)"
          echo "LEAD_TODO_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "LEAD_TODO_E2E_RUN_MARKER=gh${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "TODO_E2E_FILE_STORAGE_ROOT=$RUNNER_TEMP/lead-todo-file-center" >> "$GITHUB_ENV"
      - name: Build backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Start profile-gated real backend
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: e2e,druid
          DB_URL: jdbc:mysql://127.0.0.1:3306/law_lead_todo_e2e?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          TOKEN_SECRET: lead-todo-e2e-token-secret-with-at-least-32-characters
          FOUNDATION_E2E_IDENTITY_ENABLED: true
          FOUNDATION_TEST_IDENTITIES_ENABLED: true
          LAW_FILE_STORAGE_ROOT: ${{ runner.temp }}/lead-todo-file-center
          FLYWAY_ENABLED: true
        run: |
          nohup java -Dfoundation.test-identities.password="$LEAD_TODO_E2E_PASSWORD" -jar ruoyi-admin/target/ruoyi-admin.jar > "$RUNNER_TEMP/lead-todo-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lead-todo-backend.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/captchaImage >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/lead-todo-backend.log"
          exit 1
      - name: Install frontend dependencies
        working-directory: ruoyi-ui
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify Lead Todo E2E helper safety
        working-directory: ruoyi-ui
        run: npm run test:lead-e2e-helpers
      - name: Build production frontend
        working-directory: ruoyi-ui
        run: npm run build:prod
      - name: Install Chrome selected by the user
        working-directory: ruoyi-ui
        run: npx playwright install --with-deps chrome
      - name: Run zero-skip Lead Todo real-browser journeys
        working-directory: ruoyi-ui
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/lead-todo-playwright.json
        run: npx playwright test e2e/lead-todo-flow.spec.js --reporter=list,json
      - name: Assert all Lead Todo journeys ran with zero skips
        shell: bash
        run: |
          node -e "const r=require(process.env.RUNNER_TEMP+'/lead-todo-playwright.json'); if(r.stats.unexpected!==0||r.stats.skipped!==0||r.stats.expected<12) throw new Error(JSON.stringify(r.stats)); console.log(r.stats)"
      - name: Upload Lead Todo real-E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-todo-real-e2e-diagnostics
          path: |
            ${{ runner.temp }}/lead-todo-backend.log
            ${{ runner.temp }}/lead-todo-playwright.json
            ruoyi-ui/output/playwright
            ruoyi-ui/test-results
