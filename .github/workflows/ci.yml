name: V0.2 Foundation quality gate

on:
  push:
    branches: [v0.2-Foundation]
  pull_request:
    branches: [main, v0.2-Foundation]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify Todo UI contract
        run: npm run test:todo
      - name: Verify Todo schema runtime contract
        run: npm run test:todo-schema
      - name: Verify Foundation CI scope
        run: npm run test:foundation-ci
      - name: Verify Foundation documentation contract
        run: npm run test:foundation-docs
      - name: Verify Foundation test identity UI
        run: npm run test:foundation-identities
      - name: Verify frontend source encoding
        run: npm run test:encoding
      - name: Build production bundle
        run: npm run build:prod

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build:prod
      - name: Verify phase two business journeys
        run: npm run test:e2e

  migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: law_v017
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y mysql-client
      - name: Create isolated Foundation test database
        run: mysql --protocol=tcp -h127.0.0.1 -uroot -proot -e "create database law_v017_foundation"
      - name: Initialize v0.15 baseline schemas in empty databases
        run: |
          for database in law_v017 law_v017_foundation; do
            for file in \
              sql/ry_20260417.sql \
              sql/quartz.sql \
              sql/lead_module_20260602.sql \
              sql/lead_menu_20260602.sql \
              sql/customer_contract_module_20260603.sql \
              sql/customer_contract_dict_patch_20260611.sql \
              sql/case_module_20260611.sql \
              sql/matter_module_20260615.sql \
              sql/matter_menu_patch_20260617.sql \
              sql/finance_module_20260624.sql \
              sql/customer_tag_assign_permission_fix_20260627.sql; do
              mysql --protocol=tcp -h127.0.0.1 -uroot -proot "$database" < "$file"
            done
          done
      - name: Execute and verify all Flyway migrations
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_v017?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=FlywayMigrationTest,FileMaterialEndToEndTest,PhaseTwoDatabaseInvariantTest,TodoPhaseTwoTransactionTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Generate ephemeral Foundation test password
        shell: bash
        run: echo "FOUNDATION_TEST_USER_PASSWORD=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Verify isolated Foundation test identities
        env:
          TODO_MIGRATION_DB_URL: jdbc:mysql://127.0.0.1:3306/law_v017_foundation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
          TODO_MIGRATION_DB_USER: root
          TODO_MIGRATION_DB_PASSWORD: root
        run: mvn --batch-mode --no-transfer-progress -pl ruoyi-admin -am -Dtest=FoundationGovernanceRoleMigrationContractTest,FoundationTestIdentityEndToEndTest,FoundationTestIdentityRollbackTest -Dsurefire.failIfNoSpecifiedTests=false test
